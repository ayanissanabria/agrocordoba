<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1650" viewBox="0 0 1500 1650" role="img" aria-labelledby="title description">
  <title id="title">Diagrama entidad-relación normalizado de AgroCórdoba</title>
  <desc id="description">Diagrama en español de las trece tablas SQLite y sus relaciones, alineado con backend/app.py.</desc>
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #17324d; }
      .heading { font-size: 27px; font-weight: 700; }
      .subheading { font-size: 15px; fill: #496579; }
      .table { fill: #ffffff; stroke: #24557a; stroke-width: 2; rx: 9; }
      .tablehead { fill: #24557a; }
      .tablename { fill: #ffffff; font-size: 16px; font-weight: 700; }
      .field { font-size: 12px; }
      .physical-table { font-size: 9px; fill: #d9e8f2; }
      .key { font-weight: 700; fill: #a54b16; }
      .edge { fill: none; stroke: #68849b; stroke-width: 2; }
      .edge-label { font-size: 11px; fill: #496579; }
      .note { font-size: 12px; fill: #496579; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#68849b"/>
    </marker>
  </defs>
  <rect width="1500" height="1650" fill="#f4f7fa"/>
  <text x="36" y="44" class="heading">AgroCórdoba — Diagrama entidad-relación</text>
  <text x="36" y="70" class="subheading">SQLite / PostgreSQL · 13 tablas · PK: clave primaria · FK: clave foránea · UK: valor único</text>
  <text x="36" y="88" class="subheading">Nombres de campos traducidos; los nombres reales están en backend/database/schema.sql.</text>

  <g transform="translate(40 95)">
    <rect class="table" width="440" height="340"/>
    <path class="tablehead" d="M9 0h422a9 9 0 0 1 9 9v34H0V9a9 9 0 0 1 9-9z"/>
    <text x="18" y="28" class="tablename">USUARIO</text>
    <text x="18" y="47" class="physical-table">Tabla real: user</text>
    <text x="18" y="65" class="field"><tspan class="key">PK</tspan> id · sub de Google (UK) · correo (UK)</text>
    <text x="18" y="86" class="field">nombre · avatar · rol · ciudad · tipo de negocio</text>
    <text x="18" y="107" class="field">registro · hash de contraseña · género · teléfono</text>
    <text x="18" y="128" class="field">nombre de finca · asociación · estado</text>
    <text x="18" y="149" class="field">dirección privada de finca para recogidas acordadas</text>
    <text x="18" y="185" class="field">Una cuenta puede ser cliente, productor o administrador.</text>
  </g>

  <g transform="translate(40 510)">
    <rect class="table" width="440" height="150"/>
    <path class="tablehead" d="M9 0h422a9 9 0 0 1 9 9v34H0V9a9 9 0 0 1 9-9z"/>
    <text x="18" y="28" class="tablename">CONFIGURACIÓN DE CUENTA</text>
    <text x="18" y="47" class="physical-table">Tabla real: account_settings</text>
    <text x="18" y="65" class="field"><tspan class="key">PK</tspan> id · <tspan class="key">FK, UK</tspan> id de usuario → USUARIO.id</text>
    <text x="18" y="86" class="field">notificaciones activadas · avisos de cotización</text>
    <text x="18" y="107" class="field">avisos de respuesta</text>
  </g>

  <g transform="translate(40 710)">
    <rect class="table" width="440" height="125"/>
    <path class="tablehead" d="M9 0h422a9 9 0 0 1 9 9v34H0V9a9 9 0 0 1 9-9z"/>
    <text x="18" y="28" class="tablename">PRODUCTOS DEL PRODUCTOR</text>
    <text x="18" y="47" class="physical-table">Tabla real: producer_product</text>
    <text x="18" y="65" class="field"><tspan class="key">PK</tspan> id · <tspan class="key">FK</tspan> id de usuario → USUARIO.id · nombre</text>
    <text x="18" y="86" class="field">Unico por productor y nombre de producto</text>
  </g>

  <g transform="translate(40 885)">
    <rect class="table" width="440" height="160"/>
    <path class="tablehead" d="M9 0h422a9 9 0 0 1 9 9v34H0V9a9 9 0 0 1 9-9z"/>
    <text x="18" y="28" class="tablename">RECUPERACIÓN DE CONTRASEÑA</text>
    <text x="18" y="47" class="physical-table">Tabla real: password_reset_verification</text>
    <text x="18" y="65" class="field"><tspan class="key">PK</tspan> id · <tspan class="key">FK, UK</tspan> id de usuario → USUARIO.id</text>
    <text x="18" y="86" class="field">hash del codigo · vencimiento · envio · intentos</text>
  </g>

  <g transform="translate(40 1080)">
    <rect class="table" width="440" height="190"/>
    <path class="tablehead" d="M9 0h422a9 9 0 0 1 9 9v34H0V9a9 9 0 0 1 9-9z"/>
    <text x="18" y="28" class="tablename">VERIFICACIÓN DE CAMBIOS DE CUENTA</text>
    <text x="18" y="47" class="physical-table">Tabla real: settings_verification</text>
    <text x="18" y="65" class="field"><tspan class="key">PK</tspan> id · <tspan class="key">FK, UK</tspan> id de usuario → USUARIO.id</text>
    <text x="18" y="86" class="field">hash del codigo · correo, nombre y telefono pendientes</text>
    <text x="18" y="107" class="field">preferencias de notificacion pendientes</text>
    <text x="18" y="128" class="field">cotizaciones y respuestas pendientes de confirmar</text>
    <text x="18" y="149" class="field">vencimiento · envio · intentos</text>
  </g>

  <g transform="translate(40 1330)">
    <rect class="table" width="440" height="180"/>
    <path class="tablehead" d="M9 0h422a9 9 0 0 1 9 9v34H0V9a9 9 0 0 1 9-9z"/>
    <text x="18" y="28" class="tablename">REFERENCIA DE PRECIO SIPSA</text>
    <text x="18" y="47" class="physical-table">Tabla real: sipsa_price_reference</text>
    <text x="18" y="65" class="field"><tspan class="key">PK</tspan> id · clave y nombre normalizado del producto</text>
    <text x="18" y="86" class="field">mercado · precio en COP/kg · fecha del boletín</text>
    <text x="18" y="107" class="field">URL de la fuente oficial</text>
    <text x="18" y="128" class="field">Única por producto, mercado y fecha</text>
    <text x="18" y="149" class="field">Conserva el último dato si el origen no responde</text>
  </g>

  <g transform="translate(610 95)">
    <rect class="table" width="520" height="445"/>
    <path class="tablehead" d="M9 0h502a9 9 0 0 1 9 9v34H0V9a9 9 0 0 1 9-9z"/>
    <text x="18" y="28" class="tablename">PUBLICACIÓN DE PRODUCTO</text>
    <text x="18" y="47" class="physical-table">Tabla real: product_listing</text>
    <text x="18" y="65" class="field"><tspan class="key">PK</tspan> id · <tspan class="key">FK</tspan> id de productor → USUARIO.id</text>
    <text x="18" y="86" class="field">nombre · variedad · categoria</text>
    <text x="18" y="107" class="field">precio por kg (COP/USD) · inventario disponible</text>
    <text x="18" y="128" class="field">inventario y pedido mínimo · latitud · longitud</text>
    <text x="18" y="149" class="field">id y nombre del municipio</text>
    <text x="18" y="170" class="field">imagen · temporada · embalaje · descripción</text>
    <text x="18" y="191" class="field">destacada · experiencia del productor · creación</text>
  </g>

  <g transform="translate(1210 145)">
    <rect class="table" width="250" height="165"/>
    <path class="tablehead" d="M9 0h232a9 9 0 0 1 9 9v34H0V9a9 9 0 0 1 9-9z"/>
    <text x="16" y="28" class="tablename">CERTIFICACIÓN DEL PRODUCTO</text>
    <text x="16" y="47" class="physical-table">Tabla real: product_certification</text>
    <text x="16" y="65" class="field"><tspan class="key">PK</tspan> id</text>
    <text x="16" y="86" class="field"><tspan class="key">FK</tspan> id de publicacion</text>
    <text x="16" y="107" class="field">nombre</text>
    <text x="16" y="128" class="field">Única por publicación y nombre</text>
  </g>

  <g transform="translate(610 635)">
    <rect class="table" width="520" height="565"/>
    <path class="tablehead" d="M9 0h502a9 9 0 0 1 9 9v34H0V9a9 9 0 0 1 9-9z"/>
    <text x="18" y="28" class="tablename">COTIZACIÓN</text>
    <text x="18" y="47" class="physical-table">Tabla real: quotation_record</text>
    <text x="18" y="65" class="field"><tspan class="key">PK</tspan> id · <tspan class="key">FK</tspan> id de cliente → USUARIO.id</text>
    <text x="18" y="86" class="field"><tspan class="key">FK</tspan> id de productor → USUARIO.id</text>
    <text x="18" y="107" class="field"><tspan class="key">FK opcional</tspan> id de publicacion → PUBLICACION_PRODUCTO.id</text>
    <text x="18" y="128" class="field">id de producto: identificador historico</text>
    <text x="18" y="164" class="field">producto · variedad · nombre del productor</text>
    <text x="18" y="185" class="field">asociacion y WhatsApp del productor</text>
    <text x="18" y="206" class="field">nombre · correo y telefono del cliente</text>
    <text x="18" y="227" class="field">tipo de negocio y ciudad del cliente</text>
    <text x="18" y="263" class="field">cantidad · destino · modalidad · forma de pago</text>
    <text x="18" y="284" class="field">dirección y coordenadas de entrega (privadas)</text>
    <text x="18" y="305" class="field">costo de transporte · subtotal · total · tasa COP</text>
    <text x="18" y="326" class="field">descuento · notas · estado · fecha de creación</text>
    <text x="18" y="362" class="field">La cotización conserva los datos mostrados al crearla,</text>
    <text x="18" y="383" class="field">aunque después se elimine la publicación del producto.</text>
    <text x="18" y="404" class="field">Las direcciones solo se revelan tras acordar la oferta.</text>
  </g>

  <g transform="translate(1210 440)">
    <rect class="table" width="250" height="155"/>
    <path class="tablehead" d="M9 0h232a9 9 0 0 1 9 9v34H0V9a9 9 0 0 1 9-9z"/>
    <text x="16" y="28" class="tablename">FAVORITO</text>
    <text x="16" y="47" class="physical-table">Tabla real: favorite</text>
    <text x="16" y="65" class="field"><tspan class="key">PK</tspan> id · <tspan class="key">FK</tspan> id de usuario → USUARIO.id</text>
    <text x="16" y="86" class="field">id de producto</text>
    <text x="16" y="107" class="field">Único por usuario y producto</text>
  </g>

  <g transform="translate(1210 760)">
    <rect class="table" width="250" height="155"/>
    <path class="tablehead" d="M9 0h232a9 9 0 0 1 9 9v34H0V9a9 9 0 0 1 9-9z"/>
    <text x="16" y="28" class="tablename">NOTIFICACIÓN LEÍDA</text>
    <text x="16" y="47" class="physical-table">Tabla real: read_notification</text>
    <text x="16" y="65" class="field"><tspan class="key">PK</tspan> id · <tspan class="key">FK</tspan> id de usuario → USUARIO.id</text>
    <text x="16" y="86" class="field"><tspan class="key">FK</tspan> id de cotización → COTIZACIÓN.id</text>
    <text x="16" y="107" class="field">Única por usuario y cotización</text>
  </g>

  <g transform="translate(1210 970)">
    <rect class="table" width="250" height="300"/>
    <path class="tablehead" d="M9 0h232a9 9 0 0 1 9 9v34H0V9a9 9 0 0 1 9-9z"/>
    <text x="16" y="28" class="tablename">OFERTA DE COTIZACIÓN</text>
    <text x="16" y="47" class="physical-table">Tabla real: quotation_offer</text>
    <text x="16" y="65" class="field"><tspan class="key">PK</tspan> id</text>
    <text x="16" y="86" class="field"><tspan class="key">FK</tspan> id de cotización → COTIZACIÓN.id</text>
    <text x="16" y="107" class="field"><tspan class="key">FK</tspan> id del emisor → USUARIO.id</text>
    <text x="16" y="128" class="field">nombre del emisor</text>
    <text x="16" y="149" class="field">precio unitario · cantidad · transporte</text>
    <text x="16" y="170" class="field">total ofrecido</text>
    <text x="16" y="191" class="field">producto y precio de referencia SIPSA</text>
    <text x="16" y="212" class="field">mercado · fecha · URL de la fuente</text>
    <text x="16" y="233" class="field">estado · fechas de creación y respuesta</text>
    <text x="16" y="254" class="field">Instantánea histórica de cada oferta</text>
  </g>

  <g transform="translate(1210 1320)">
    <rect class="table" width="250" height="210"/>
    <path class="tablehead" d="M9 0h232a9 9 0 0 1 9 9v34H0V9a9 9 0 0 1 9-9z"/>
    <text x="16" y="28" class="tablename">MENSAJE DE COTIZACIÓN</text>
    <text x="16" y="47" class="physical-table">Tabla real: quotation_message</text>
    <text x="16" y="65" class="field"><tspan class="key">PK</tspan> id</text>
    <text x="16" y="86" class="field"><tspan class="key">FK</tspan> id de cotización → COTIZACIÓN.id</text>
    <text x="16" y="107" class="field"><tspan class="key">FK</tspan> id del emisor → USUARIO.id</text>
    <text x="16" y="128" class="field">nombre del emisor · contenido</text>
    <text x="16" y="149" class="field">tipo de mensaje · oferta opcional</text>
    <text x="16" y="170" class="field">fecha de creación · fecha de lectura</text>
    <text x="16" y="191" class="field">Historial persistido por cotización</text>
  </g>

  <path class="edge" marker-end="url(#arrow)" d="M40 350 H20 V580 H40"/>
  <text x="23" y="475" class="edge-label">1 : 0..1</text>
  <path class="edge" marker-end="url(#arrow)" d="M40 320 H26 V770 H40"/>
  <text x="29" y="690" class="edge-label">1 : N</text>
  <path class="edge" marker-end="url(#arrow)" d="M40 290 H12 V950 H40"/>
  <text x="15" y="870" class="edge-label">1 : 0..1</text>
  <path class="edge" marker-end="url(#arrow)" d="M40 260 H6 V1150 H40"/>
  <text x="9" y="1065" class="edge-label">1 : 0..1</text>
  <path class="edge" marker-end="url(#arrow)" d="M480 360 H610"/>
  <text x="515" y="350" class="edge-label">1 : N (productor)</text>
  <path class="edge" marker-end="url(#arrow)" d="M1130 220 H1210"/>
  <text x="1135" y="210" class="edge-label">1 : N</text>
  <path class="edge" marker-end="url(#arrow)" d="M870 540 V635"/>
  <text x="880" y="590" class="edge-label">0..1 : N</text>
  <path class="edge" marker-end="url(#arrow)" d="M480 390 H565 V710 H610"/>
  <text x="490" y="690" class="edge-label">1 : N (cliente)</text>
  <path class="edge" marker-end="url(#arrow)" d="M480 405 H580 V750 H610"/>
  <text x="490" y="770" class="edge-label">1 : N (productor)</text>
  <path class="edge" marker-end="url(#arrow)" d="M480 420 H565 V600 H1185 V510 H1210"/>
  <text x="830" y="590" class="edge-label">1 : N (favoritos)</text>
  <path class="edge" marker-end="url(#arrow)" d="M480 415 H555 V1220 H1185 V835 H1210"/>
  <text x="900" y="1210" class="edge-label">1 : N (usuario que lee)</text>
  <path class="edge" marker-end="url(#arrow)" d="M1130 1020 H1210"/>
  <text x="1135" y="1010" class="edge-label">1 : N (ofertas)</text>
  <path class="edge" marker-end="url(#arrow)" d="M1130 1150 H1170 V1390 H1210"/>
  <text x="1135" y="1140" class="edge-label">1 : N (mensajes)</text>
  <path class="edge" marker-end="url(#arrow)" d="M1335 1270 V1320"/>
  <text x="1345" y="1305" class="edge-label">0..1 : 1</text>
  <path class="edge" marker-end="url(#arrow)" d="M480 335 H500 V1570 H1185 V1080 H1210"/>
  <text x="730" y="1560" class="edge-label">1 : N (emisor)</text>
  <path class="edge" marker-end="url(#arrow)" d="M480 335 H510 V1600 H1195 V1390 H1210"/>
  <text x="730" y="1590" class="edge-label">1 : N (emisor de mensajes)</text>

  <text x="610" y="1260" class="note">La referencia opcional permite conservar una cotización histórica si se elimina el producto.</text>
  <text x="610" y="1280" class="note">La base de muestra contiene datos ficticios; las ofertas guardan el precio SIPSA usado al negociarlas.</text>
</svg>
